[package]
name = "oktree"
description = "Fast octree implementation."
version = "0.5.1"
repository = "https://github.com/exor2008/oktree"
keywords = ["graphics", "bevy", "voxel", "octree"]
edition = "2021"
license = "MIT"

[features]
default = ["std"]
std = ["num/default", "bevy?/std"]
bevy = [
    "dep:bevy",
    "bevy/std",
    "bevy/default_app",
    "bevy/bevy_winit",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_gizmos",
    "bevy/bevy_gizmos_render",
    "bevy/multi_threaded",
    "bevy/x11",
]

[dependencies]
num = { version = "0.4.3", default-features = false }
bevy = { version = ">=0.10", default-features = false, optional = true }
heapless = "0.9.2"
smallvec = { version = "1.15.1", features = ["const_generics"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.1"

[[bench]]
name = "benchmark"
harness = false
required-features = ["bevy"]

[[example]]
name = "simple"
path = "examples/simple.rs"
required-features = ["bevy"]

[[example]]
name = "bevy_tree"
path = "examples/bevy_tree.rs"
required-features = ["bevy"]

[[example]]
name = "profile"
path = "examples/profile.rs"
required-features = ["bevy"]

[[example]]
name = "no_std"
path = "examples/no_std.rs"
required-features = ["bevy"]

[package.metadata.docs.rs]
all-features = true

[profile.profiler]
inherits = "release"
debug = true
split-debuginfo = "full"
opt-level = 3
